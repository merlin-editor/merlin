[package]
name = "merlin"
description = "A light native code editor with sandboxed WebAssembly plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
merlin-core.workspace = true
merlin-plugins.workspace = true
anyhow.workspace = true
ignore = "0.4"
globset = "0.4"
alacritty_terminal = "0.26"
toml = "0.9"
serde_json = "1"
toml_edit = "0.25.18"
winit = "0.30"
softbuffer = "0.4"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
unicode-script = "0.5"
resvg = { version = "0.49", default-features = false }
png = "0.18"
trash = "5"
# FSEvents is its macOS backend; it does nothing elsewhere.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rfd = "0.17.2"
copypasta = "0.10.2"
raw-window-handle = "0.6"
# Fetches registries' indexes and packages.
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Attaching to the terminal merlin was started from.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
# The local time's offset from UTC, for times in the Output panel.
libc = "0.2"
