[package]
name = "merlin"
description = "A light native code editor with sandboxed WebAssembly plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
merlin-core.workspace = true
merlin-plugins.workspace = true
anyhow.workspace = true
ignore = "0.4"
globset = "0.4"
toml = "0.9"
toml_edit = "0.25.18"
winit = "0.30"
softbuffer = "0.4"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
resvg = { version = "0.49", default-features = false }
trash = "5"
notify = { version = "8", default-features = false }
rfd = "0.17.2"
copypasta = "0.10.2"
raw-window-handle = "0.6"
