[package]
name = "merlin-plugins"
description = "Runs WebAssembly component plugins in a sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
merlin-core.workspace = true
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
regex.workspace = true
ignore = "0.4"
wasmtime = "50"
wasmtime-wasi = "50"
png = "0.18"
# `.merlin` packages: a deterministic gzipped tar, its SHA-256, and the
# manifest rewritten in place.
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.10"
toml_edit = "0.25"
globset = "0.4"
# Registries' index.json files are signed with minisign.
minisign-verify = "0.2"

[dev-dependencies]
# Signs indexes in tests, as a registry would.
minisign = "0.7"
