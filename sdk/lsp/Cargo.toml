[package]
name = "merlin-lsp"
description = "Language Server Protocol client for merlin language plugins"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
merlin-plugin = { path = "../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugins build it for wasm32-wasip2, so it stays out of the editor's
# workspace.
[workspace]
