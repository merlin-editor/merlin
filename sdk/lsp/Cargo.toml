[package]
name = "merlin-lsp"
description = "Language Server Protocol client for merlin language plugins"
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/merlin-editor/merlin"
readme = "README.md"
keywords = ["merlin", "editor", "plugin", "lsp", "language-server"]
categories = ["development-tools", "text-editors", "wasm"]
# Only what the crate needs: no build output.
include = ["src/**", "README.md"]

[dependencies]
# The path here, the version once published.
merlin-plugin = { path = "../rust", version = "0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# docs.rs builds it for the target plugins use.
[package.metadata.docs.rs]
targets = ["wasm32-wasip2"]

# Plugins build it for wasm32-wasip2, so it stays out of the editor's
# workspace.
[workspace]
