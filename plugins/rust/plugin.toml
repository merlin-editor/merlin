name = "rust"
title = "Rust"
description = "Syntax, tests, Cargo tasks & rust-analyzer"
api = "0.9"
component = "target/wasm32-wasip2/release/rust_language.wasm"
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["rust-analyzer"]
# To find the project's tests and read its Cargo.toml files.
workspace-read = true
# To run cargo test and read how the tests went.
terminal = true

[[languages]]
id = "rust"
name = "Rust"
extensions = ["rs"]
line-comment = "//"
block-comment = ["/*", "*/"]

# Debuggers for Rust, best first; the first one installed is used.
[[debuggers]]
id = "lldb-dap"
name = "lldb-dap"
languages = ["rust"]
command = ["lldb-dap"]
install = "sudo apt install lldb"
# Every panic goes through rust_panic, named __rustc::rust_panic in
# newer versions of Rust.
stop-on = [{ id = "rust-panic", label = "Rust panics", functions = ["rust_panic", "__rustc::rust_panic"], default = true }]

[[debuggers]]
id = "gdb"
name = "gdb"
languages = ["rust"]
command = ["gdb", "--interpreter=dap", "-q"]
install = "sudo apt install gdb"
stop-on = [{ id = "rust-panic", label = "Rust panics", functions = ["rust_panic", "__rustc::rust_panic"], default = true }]
