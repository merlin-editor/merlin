name = "rust"
title = "Rust"
api = "0.8"
component = "target/wasm32-wasip2/release/rust_language.wasm"

[permissions]
editor-read = true

[[languages]]
id = "rust"
name = "Rust"
extensions = ["rs"]
line-comment = "//"
block-comment = ["/*", "*/"]

# Debuggers for Rust, best first; the first one installed is used.
[[debuggers]]
id = "lldb-dap"
name = "lldb-dap"
languages = ["rust"]
command = ["lldb-dap"]
install = "sudo apt install lldb"
# Every panic goes through rust_panic, named __rustc::rust_panic in
# newer versions of Rust.
stop-on = [{ id = "rust-panic", label = "Rust panics", functions = ["rust_panic", "__rustc::rust_panic"], default = true }]

[[debuggers]]
id = "gdb"
name = "gdb"
languages = ["rust"]
command = ["gdb", "--interpreter=dap", "-q"]
install = "sudo apt install gdb"
stop-on = [{ id = "rust-panic", label = "Rust panics", functions = ["rust_panic", "__rustc::rust_panic"], default = true }]
