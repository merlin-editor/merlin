name = "rust"
title = "Rust"
description = "Syntax, tests, Cargo tasks & rust-analyzer"
badge = "RS"
hue = "orange"
version = "0.1.0"
api = "0.14"
component = "target/wasm32-wasip2/release/rust_language.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = ["language:rust", "file:Cargo.toml"]
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["rust-analyzer"]
# To find the project's tests and read its Cargo.toml files.
workspace-read = true
# To run cargo test and read how the tests went.
terminal = true

# Settings on its page in Settings › Plugins, for you or the workspace.
[settings.check-command]
type = "choice"
title = "Check on save"
default = "check"
choices = [
    { value = "check", label = "cargo check" },
    { value = "clippy", label = "cargo clippy" },
]
description = "What rust-analyzer runs when you save."

[settings.features]
type = "list"
title = "Features"
description = "Cargo features rust-analyzer turns on when it checks."

[[languages]]
id = "rust"
name = "Rust"
extensions = ["rs"]
line-comment = "//"
block-comment = ["/*", "*/"]
exception = "panic"

# rustc's problems in a task's output: `error[E0308]: mismatched types`,
# then `  --> src/main.rs:5:23` under it.
[[problem-matchers]]
lines = [
    { regex = '^(error|warning)(?:\[(E\d{4})\])?: (.+)$', severity = 1, code = 2, message = 3 },
    { regex = '^\s*--> (.+):(\d+):(\d+)$', file = 1, line = 2, column = 3 },
]
link = "https://doc.rust-lang.org/error_codes/{code}.html"

# Debuggers for Rust, best first; the first one installed is used.
[[debuggers]]
id = "lldb-dap"
name = "lldb-dap"
languages = ["rust"]
command = ["lldb-dap"]
install = "sudo apt install lldb"
# Every panic goes through rust_panic, named __rustc::rust_panic in
# newer versions of Rust.
stop-on = [{ id = "rust-panic", label = "Rust panics", functions = ["rust_panic", "__rustc::rust_panic"], default = true }]

[[debuggers]]
id = "gdb"
name = "gdb"
languages = ["rust"]
command = ["gdb", "--interpreter=dap", "-q"]
install = "sudo apt install gdb"
stop-on = [{ id = "rust-panic", label = "Rust panics", functions = ["rust_panic", "__rustc::rust_panic"], default = true }]
