name = "cpp"
title = "C/C++"
description = "C & C++ colours, clangd, and debugging with gdb or lldb"
badge = "C+"
hue = "blue"
version = "0.3.0"
api = "0.16"
component = "target/wasm32-wasip2/release/cpp.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = [
    "language:c",
    "language:cpp",
    "file:CMakeLists.txt",
    "file:compile_commands.json",
    "file:build/compile_commands.json",
]
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
# To read compile_commands.json, for Problems' Check Project, and the
# sources, for symbols when there's none.
workspace-read = true
# To keep excluded folders out of clangd's index, in .clangd, when asked.
workspace-write = true
processes = ["clangd"]

# Where the build put compile_commands.json: a build plugin, such as
# CMake's, says so. The setting below wins over it.
[shared]
watches = ["compile-commands", "build-setup"]

[settings.compile-commands]
type = "text"
title = "Compile commands folder"
description = "The folder compile_commands.json is in, relative to the workspace or absolute. Empty to use the one a build plugin shares, or let clangd look for it."

[settings.index-excluded]
type = "flag"
title = "Keep clangd out of excluded folders"
default = false
description = "Writes an Index: Background: Skip block for Settings › Files' Exclude into the project's .clangd, between merlin's comment lines, leaving the rest of the file alone. Indexing is quicker, but Go to Definition into those files works only once they're open."

[settings.include-folders]
type = "list"
title = "Include folders"
description = "Folders to find headers in, relative to the workspace or absolute, for files no compile_commands.json or compile_flags.txt covers: a project without a build system, say."

[settings.defines]
type = "list"
title = "Defines"
description = "Macros to define, as NAME or NAME=value, for files no compile_commands.json or compile_flags.txt covers."

[settings.query-driver]
type = "list"
title = "Compilers to ask"
description = "Compilers clangd may run to learn their include folders and target, as globs such as /usr/bin/arm-none-eabi-*. Needed for gcc and cross-compilers; clang's own clangd already knows."

[settings.fallback-style]
type = "choice"
title = "Style when there's no .clang-format"
default = "LLVM"
choices = [
    { value = "LLVM", label = "LLVM: 2 spaces" },
    { value = "Google", label = "Google: 2 spaces" },
    { value = "Chromium", label = "Chromium: 2 spaces" },
    { value = "Mozilla", label = "Mozilla: 2 spaces" },
    { value = "GNU", label = "GNU: 2 spaces, braces on their own lines" },
    { value = "WebKit", label = "WebKit: 4 spaces" },
    { value = "Microsoft", label = "Microsoft: 4 spaces, braces on their own lines" },
]
description = "How clangd lays out code it formats or writes, such as an extracted function, in a project without a .clang-format file. A .clang-format always wins; add one for anything else, such as LLVM's style with 4 spaces."

[[languages]]
id = "c"
name = "C"
# .h is C++, as in VS Code: C++ projects have far more headers, and C
# reads the same.
extensions = ["c"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[languages]]
id = "cpp"
name = "C++"
extensions = ["cpp", "cc", "cxx", "c++", "h", "hpp", "hh", "hxx", "h++", "ipp", "inl", "tpp"]
line-comment = "//"
block-comment = ["/*", "*/"]

# Compilers' problems in a task's output. gcc and clang print
# `src/a.cpp:3:5: warning: unused variable 'x' [-Wunused-variable]`; the
# flag is the problem's code. The path may start with a drive, as `C:\`.
[[problem-matchers]]
lines = [
    { regex = '^((?:[A-Za-z]:)?[^:]+):(\d+):(?:(\d+):)? (fatal error|error|warning): (.+?)(?: \[([^\]]+)\])?$', file = 1, line = 2, column = 3, severity = 4, message = 5, code = 6 },
]

# MSVC prints `src\a.cpp(3,5): error C2065: 'x': undeclared identifier`.
[[problem-matchers]]
lines = [
    { regex = '^\s*(.+?)\((\d+)(?:,(\d+))?\)\s*: (fatal error|error|warning) ([A-Z]+\d+): (.+)$', file = 1, line = 2, column = 3, severity = 4, code = 5, message = 6 },
]

[[debuggers]]
id = "lldb-dap"
name = "lldb-dap"
languages = ["c", "cpp"]
command = ["lldb-dap"]
install = { linux = "sudo apt install lldb", macos = "xcode-select --install", windows = "winget install LLVM.LLVM" }
url = "https://lldb.llvm.org/"

[[debuggers]]
id = "gdb"
name = "gdb"
languages = ["c", "cpp"]
command = ["gdb", "--interpreter=dap", "-q"]
install = { linux = "sudo apt install gdb", macos = "brew install gdb" }
url = "https://www.sourceware.org/gdb/"

# What it starts, what each is for, and how to install it here.
[programs.clangd]
for = "Completion, errors and go to definition"
install = { linux = "sudo apt install clangd", macos = "brew install llvm", windows = "winget install LLVM.LLVM" }
url = "https://clangd.llvm.org/installation"
