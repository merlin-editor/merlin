name = "cpp"
title = "C/C++"
description = "C & C++ syntax, outlines & clangd"
badge = "C+"
hue = "blue"
api = "0.9"
component = "target/wasm32-wasip2/release/cpp.wasm"
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["clangd"]

[[languages]]
id = "c"
name = "C"
extensions = ["c", "h"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[languages]]
id = "cpp"
name = "C++"
extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx", "h++", "ipp", "inl", "tpp"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[debuggers]]
id = "lldb-dap"
name = "lldb-dap"
languages = ["c", "cpp"]
command = ["lldb-dap"]
install = "sudo apt install lldb"

[[debuggers]]
id = "gdb"
name = "gdb"
languages = ["c", "cpp"]
command = ["gdb", "--interpreter=dap", "-q"]
install = "sudo apt install gdb"
