name = "cpp"
title = "C/C++"
description = "C & C++ syntax, outlines & clangd"
badge = "C+"
hue = "blue"
version = "0.2.0"
api = "0.16"
component = "target/wasm32-wasip2/release/cpp.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = ["language:c", "language:cpp", "file:CMakeLists.txt"]
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["clangd"]

# Where the build put compile_commands.json: a build plugin, such as
# CMake's, says so. The setting below wins over it.
[shared]
watches = ["compile-commands"]

[settings.compile-commands]
type = "text"
title = "Compile commands folder"
description = "The folder compile_commands.json is in, relative to the workspace or absolute. Empty to use the one a build plugin shares, or let clangd look for it."

[[languages]]
id = "c"
name = "C"
extensions = ["c", "h"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[languages]]
id = "cpp"
name = "C++"
extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx", "h++", "ipp", "inl", "tpp"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[debuggers]]
id = "lldb-dap"
name = "lldb-dap"
languages = ["c", "cpp"]
command = ["lldb-dap"]
install = { linux = "sudo apt install lldb", macos = "xcode-select --install", windows = "winget install LLVM.LLVM" }
url = "https://lldb.llvm.org/"

[[debuggers]]
id = "gdb"
name = "gdb"
languages = ["c", "cpp"]
command = ["gdb", "--interpreter=dap", "-q"]
install = { linux = "sudo apt install gdb", macos = "brew install gdb" }
url = "https://www.sourceware.org/gdb/"

# What it starts, what each is for, and how to install it here.
[programs.clangd]
for = "Completion, errors and go to definition"
install = { linux = "sudo apt install clangd", macos = "brew install llvm", windows = "winget install LLVM.LLVM" }
url = "https://clangd.llvm.org/installation"
