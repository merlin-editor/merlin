name = "python"
title = "Python"
description = "Python syntax, pytest & pyright"
badge = "PY"
hue = "cyan"
version = "0.1.0"
api = "0.14"
component = "target/wasm32-wasip2/release/python_language.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = ["language:python", "file:pyproject.toml", "file:setup.py"]
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["pyright-langserver"]

[[languages]]
id = "python"
name = "Python"
extensions = ["py", "pyi"]
line-comment = "#"
# A line ending in a colon opens a block.
indent-after = [":"]

# A traceback: the last frame in the project, its own files rather than
# the libraries', then the exception at the end.
[[problem-matchers]]
lines = [
    { regex = '^\s*File "([^/"][^"]*)", line (\d+)', file = 1, line = 2 },
    { regex = '^[A-Za-z_][\w.]*(?:: .*)?$', message = 0 },
]
between = '^\s'

[[debuggers]]
id = "debugpy"
name = "debugpy"
languages = ["python"]
command = ["python3", "-m", "debugpy.adapter"]
install = "pip install debugpy"
launch = { justMyCode = true, console = "internalConsole" }
