name = "testbed"
title = "Testbed"
api = "0.11"
component = "target/wasm32-wasip2/release/testbed.wasm"

[permissions]
editor-read = true
processes = ["cat"]

[settings]
greeting = "hello"
style = { loud = false }

[settings.mode]
type = "choice"
default = "fast"
choices = [{ value = "fast", label = "Quickly" }, "careful"]
description = "How it works."

[settings.token]
type = "secret"
title = "API key"
description = "Kept in your keyring."

[settings.server-path]
type = "path"
scope = "user-only"
default = "/usr/bin/cat"
description = "A program on this computer."

[[languages]]
id = "notes"
name = "Notes"
extensions = ["notes"]
line-comment = ";"

# A command in the editor's, the Explorer's and a tab's right-click menus.
[[menus]]
where = "editor"
command = "about"
title = "Ask Testbed About This"

[[menus]]
where = "explorer"
command = "about"

[[menus]]
where = "tab"
command = "about"

# One view in each place a view can go, for the window's tests.
[[views]]
id = "activity"
title = "Activity"
icon = "list"
where = "left"
empty = "Nothing yet."

[[views.toolbar]]
command = "count"
icon = "plus"

[[views]]
id = "chat"
title = "Chat"
icon = "icons/chat.svg"
where = "right"
empty = "Ask about this file."

[[views]]
id = "runs"
title = "Runs"
icon = "play"
where = "bottom"
empty = "No runs yet."
