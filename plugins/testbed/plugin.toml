name = "testbed"
title = "Testbed"
api = "0.9"
component = "target/wasm32-wasip2/release/testbed.wasm"

[permissions]
editor-read = true
processes = ["cat"]

[settings]
greeting = "hello"
style = { loud = false }

[settings.mode]
type = "choice"
default = "fast"
choices = [{ value = "fast", label = "Quickly" }, "careful"]
description = "How it works."

[settings.server-path]
type = "path"
scope = "user-only"
default = "/usr/bin/cat"
description = "A program on this computer."

[[languages]]
id = "notes"
name = "Notes"
extensions = ["notes"]
line-comment = ";"
