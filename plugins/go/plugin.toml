name = "go"
title = "Go"
description = "Go syntax & gopls"
badge = "GO"
hue = "cyan"
version = "0.2.0"
api = "0.16"
component = "target/wasm32-wasip2/release/go_language.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = ["language:go", "file:go.mod"]
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["gopls"]

[[languages]]
id = "go"
name = "Go"
extensions = ["go"]
line-comment = "//"
block-comment = ["/*", "*/"]
exception = "panic"

# What it starts, what it's for, and how to install it here.
[programs.gopls]
for = "Completion, errors and go to definition"
install = "go install golang.org/x/tools/gopls@latest"
url = "https://go.dev/gopls/"
