# merlin's icon packs. Data only: no component, and nothing to allow.
name = "merlin-icons"
title = "merlin Icons"
description = "File and UI icon themes"
badge = "IC"
hue = "purple"
version = "0.1.0"
api = "0.14"

# Icon themes, for Preferences: File Icon Theme.
[[packs]]
label = "Origami"
file = "origami.toml"

[[packs]]
label = "Outline"
file = "outline.toml"

# A pack with only the frame's icons, to layer over any icon theme in
# Preferences: Theme Packs.
[[packs]]
label = "Line Icons"
file = "line.toml"

# The script that draws the icons stays out of the package.
[package]
exclude = ["tools/"]
