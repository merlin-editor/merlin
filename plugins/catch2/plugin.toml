name = "catch2"
title = "Catch2"
description = "Catch2 test discovery & runner for C++"
badge = "C2"
hue = "green"
api = "0.13"
component = "target/wasm32-wasip2/release/catch2.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = ["language:cpp", "file:CMakeLists.txt"]

[permissions]
editor-read = true
# To run ctest and read how the tests went.
terminal = true

[[languages]]
id = "cpp"
name = "C++"
extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx"]
line-comment = "//"
block-comment = ["/*", "*/"]
