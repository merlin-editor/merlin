name = "javascript"
title = "JavaScript"
description = "JS & TypeScript syntax, tasks & tsserver"
api = "0.9"
component = "target/wasm32-wasip2/release/javascript_language.wasm"
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["typescript-language-server"]
# To read package.json's scripts for Run Task.
workspace-read = true

[[languages]]
id = "javascript"
name = "JavaScript"
extensions = ["js", "mjs", "cjs", "jsx"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[languages]]
id = "typescript"
name = "TypeScript"
extensions = ["ts", "tsx"]
line-comment = "//"
block-comment = ["/*", "*/"]
