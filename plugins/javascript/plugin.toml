name = "javascript"
title = "JavaScript"
description = "JS & TypeScript syntax, tasks & tsserver"
badge = "JS"
hue = "yellow"
api = "0.11"
component = "target/wasm32-wasip2/release/javascript_language.wasm"
# Starts when one of its files opens, or the project has one.
activate-on = ["language:javascript", "language:typescript", "file:package.json"]
symbols = "project-symbols"

[permissions]
editor-read = true
editor-write = true
processes = ["typescript-language-server"]
# To read package.json's scripts for Run Task.
workspace-read = true

[[languages]]
id = "javascript"
name = "JavaScript"
extensions = ["js", "mjs", "cjs", "jsx"]
line-comment = "//"
block-comment = ["/*", "*/"]

[[languages]]
id = "typescript"
name = "TypeScript"
extensions = ["ts", "tsx"]
line-comment = "//"
block-comment = ["/*", "*/"]

# TypeScript's compiler: `src/a.ts(3,5): error TS2322: message`.
[[problem-matchers]]
lines = [
    { regex = '^(\S+?)\((\d+),(\d+)\): (error|warning|info) (TS\d+): (.*)$', file = 1, line = 2, column = 3, severity = 4, code = 5, message = 6 },
]
