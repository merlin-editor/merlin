name: CI & Editor Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.*'   # Matches v0.1.0, v1.0.0, etc. Ignores sdk-v* tags
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # The plugin host's tests load real plugins. Grammars' C code needs a
      # clang that targets wasm: Linux's and Windows' runners have one, and
      # macOS's Apple clang doesn't, so it uses Homebrew's LLVM.
      - name: Use LLVM's clang for wasm (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "CC_wasm32_wasip2=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip2=$(brew --prefix llvm)/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build the plugins the tests load
        shell: bash
        run: |
          for dir in plugins/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "Building $dir"
            (cd "$dir" && cargo build --release --locked --quiet)
          done

      - name: Run workspace tests
        run: cargo test --workspace

  # The plugins that come with merlin: the registry's own packages for this
  # merlin's plugin API, fetched once so every archive has the same bytes.
  # A plugin without a version for the API fails the release; release it to
  # merlin-editor/plugins first (docs/distribution.md, section 9, A3).
  bundle:
    name: Bundle plugins
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch the registry's packages
        run: |
          cargo build --bin merlin
          ./target/debug/merlin plugin fetch bundle

      - name: Keep them for the archives
        uses: actions/upload-artifact@v6
        with:
          name: bundled-plugins
          path: bundle/
          if-no-files-found: error

  release:
    name: Release (${{ matrix.target }})
    needs: [test, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: merlin
            archive_name: merlin-linux-x86_64.tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: merlin
            archive_name: merlin-linux-aarch64.tar.gz

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: merlin
            archive_name: merlin-macos-aarch64.tar.gz

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: merlin
            archive_name: merlin-macos-x86_64.tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: merlin.exe
            archive_name: merlin-windows-x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build release binary
        run: cargo build --release --bin merlin

      - name: Get the bundled plugins
        uses: actions/download-artifact@v7
        with:
          name: bundled-plugins
          path: staging/plugins

      - name: Package Unix Archive (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/release/${{ matrix.binary_name }} staging/
          cp README.md LICENSE staging/
          tar -czf ${{ matrix.archive_name }} -C staging ${{ matrix.binary_name }} README.md LICENSE plugins
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Package Windows Archive (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/${{ matrix.binary_name }} staging/
          cp README.md LICENSE staging/
          7z a ${{ matrix.archive_name }} ./staging/*
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
