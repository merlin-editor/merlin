name: Release SDK to crates.io

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK Crates
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish merlin-plugin
        run: |
          cd sdk/rust
          cargo publish --locked --target wasm32-wasip2
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crates.io index to update
        run: sleep 25

      - name: Publish merlin-lsp and merlin-grammar
        run: |
          (cd sdk/lsp && cargo publish --locked --target wasm32-wasip2)
          (cd sdk/grammar && cargo publish --locked --target wasm32-wasip2)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
